schema_version: 1
project:
  name: PocketForge Relay
  repository_slug: pocketforge-relay
  maturity: working-mvp
  category: [mobile-first-developer-infrastructure, self-hosted-build-control-plane, agent-ready-orchestration]
  thesis: A phone should command the full development loop rather than imitate a desktop IDE.
  core_loop: [request, checkout, execute, stream, artifact, verify, iterate]
mvp:
  implemented: [mobile-pwa, en-ko-ja-localization, bearer-auth, bundled-demo, public-github-checkout, fixed-presets, sse-log-stream, artifact-download, per-job-workspace, bounded-execution, durable-event-store, contract-tested-github-actions-adapter, contract-tested-android-device-evidence, proposal-only-agent-manager, authenticated-proposal-api]
  not_implemented: [hardened-sandbox, private-repository-auth, production-ai-provider-transport, multi-user-rbac, signed-user-device-pairing]
ai_goal:
  role: human-governed evidence assistant
  uses: [issue-triage, failure-reproduction, log-classification, adapter-conformance-tests, security-boundary-review, documentation-parity, verified-release-notes, contributor-guidance]
  forbidden_shortcuts: [arbitrary-client-shell, silent-high-impact-actions, inferred-pass-claims, automatic-install-merge-release-deploy, external-ai-evidence-upload-without-opt-in]
invariants:
  - user_input_must_not_become_arbitrary_shell_code
  - each_job_uses_a_distinct_workspace
  - relay_managed_logs_apply_defensive_secret_redaction
  - repository_artifacts_are_not_assumed_secret_free
  - execution_capabilities_are_allowlisted
extension_points: [source_adapter, runner_adapter, agent_adapter, artifact_adapter, device_adapter, policy_adapter]
license: Apache-2.0
